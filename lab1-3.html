<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Strand</title>
    <!-- Load the A-Frame library from CDN -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky id="daySky" src="fotos/photo-1536866497758-6010af3ee792.jpeg"></a-sky>
      <a-sky id="nightSky" src="fotos/sky_96_2k.png" material="opacity: 0"></a-sky>

      <!-- Water Plane -->
      <a-plane position="0 0.1 -20" rotation="-90 0 0" width="100" height="40" src="fotos/watertexture.jpg"></a-plane>

      <!-- Waves -->
      <a-entity position="0 0.2 -20">
        <a-box position="-18 0 0" width="6" height="1.2" depth="1.2" color="#8fd0ea" animation="property: position; to: -18 0.5 0; dur: 2200; dir: alternate; loop: true; easing: easeInOutSine"></a-box>
        <a-box position="-8 0 0" width="6" height="1.4" depth="1.2" color="#8fd0ea" animation="property: position; to: -8 0.7 0; dur: 2600; dir: alternate; loop: true; easing: easeInOutSine"></a-box>
        <a-box position="2 0 0" width="6" height="1.6" depth="1.2" color="#8fd0ea" animation="property: position; to: 2 0.5 0; dur: 2400; dir: alternate; loop: true; easing: easeInOutSine"></a-box>
        <a-box position="12 0 0" width="6" height="1.7" depth="1.2" color="#8fd0ea" animation="property: position; to: 12 0.6 0; dur: 2800; dir: alternate; loop: true; easing: easeInOutSine"></a-box>
      </a-entity>

      <!-- Strand  Plane -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="40" src="fotos/aerial_beach_01_diff_4k.jpg" material="repeat:3 3"></a-plane>

      <!-- Zon -->
      <a-entity
        id="sun"
        sunset-sky
        position="-28 -4 -30"
        animation="property: position; from: -28 -4 -30; to: -28 18 -30; dur: 14000; loop: true; dir: alternate; easing: easeInOutSine">
        <a-sphere radius="4" color="#FFD700"></a-sphere>
        <a-light type="point" color="#FFD700" intensity="2" distance="120"></a-light>

      </a-entity>

      <a-light id="ambientLight" type="ambient" color="#FFF" intensity="1"></a-light>

      <a-entity id="schelp" position="-1 -0.2 2" rotation="0 0 20" animation="property: rotation; to: 0 360 20; dur: 12000; loop: true; easing: linear">
        <a-sphere position="0 0 0" radius="0.55" scale="1.5 0.9 1.2" material="color: #dfeef1; opacity: 0.95"></a-sphere>
        <a-torus position="0 0 0" radius="0.7" radius-tubular="0.12" arc="260" rotation="90 0 0" material="color: #c7dfe7"></a-torus>
        <a-box position="-0.18 0.1 0.25" width="0.18" height="0.08" depth="0.10" material="color: #b7ccd6"></a-box>
      </a-entity>

      <a-assets>
        <audio id="oceaan" src="sounds/oceaan.mp3" autoplay="true" loop="true"></audio>
      </a-assets>
        <a-camera position="0 1.6 0">
        <a-cursor></a-cursor>
        </a-camera>
        <a-entity id="parasol" position="-4 0.5 3">
      <a-cylinder position="0 0 0" radius="0.08" height="2.2" material="color: #8B4513"></a-cylinder>
      <a-cone
        position="0 1.25 0"
        radius-bottom="1.1"     
        radius-top="0.05"
        height="0.9"
        material="color: #E74C3C"
        animation="property: rotation; to: 0 10 6; dur: 1400; dir: alternate; loop: true; easing: easeInOutSine">
      </a-cone>
      <a-box
        position="0 0.9 0"
        width="1.7"
        height="0.03"
        depth="0.03"
        material="color: #FDF5E6; opacity: 0.9"
        animation="property: rotation; to: 0 8 0; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine">
      </a-box>
    </a-entity> 
    </a-scene>
    <script src="JS/night-sky.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
