<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Strand</title>
    <!-- Load the A-Frame library from CDN -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky src="fotos/photo-1536866497758-6010af3ee792.jpeg"></a-sky>
      <!-- Water Plane -->
      <a-plane position="0 0.1 -20" rotation="-90 0 0" width="100" height="40" color="#1E90FF"></a-plane>

      <!-- Strand  Plane -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="40" color="#F4A460"></a-plane>

      <!-- Zon -->
      <a-sphere position="10 15 -30" radius="4" color="#FFD700"></a-sphere>
      <a-light type="ambient" color="#FFF"></a-light>
        <a-entity
        id="schelp"
        geometry="primitive: cone; radiusBottom: 0.7; radiusTop: 0.15; height: 1.2; segmentsRadial: 64"
        position="-1 -0.2 2"
        material="color: #bfced8;"
        sound="src: #oceaan; on: click; volume: 1.0"
        animation="property: scale;
        to: 1.5 1.5 1.5; 
        dur: 300; 
        dir: alternate; 
        loop: 1"
        animation__move="property: position; on: click; to: 1 -0.15 2; dur: 6000; dir: alternate; loop: true; easing: easeInOutSine"
        animation__bob="property: rotation; on: click; to: -90 0 8; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine">
    </a-entity>
    <a-assests>
        <audio id="oceaan" src="sounds/oceaan.mp3"></audio>
    </a-assests>
        <a-camera position="0 1.6 0">
        <a-cursor></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
