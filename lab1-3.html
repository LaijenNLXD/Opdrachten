<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <title>Schelp</title>
</head>
<body>
    <a-entity
    id="schelp"
    geometry="primitive: sphere; radius: 0.3"
    position="2 0.5 -3"

    sound="src: #oceaan; on: click"
    animation="property:scale;
    to: 1.5 1.5 1.5;
    dur:300;
    dir:a:alternate
    loop:1">
</a-entity>
</body>
</html>
